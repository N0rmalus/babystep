<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Babystep · Dydžių gidas C · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/babystep/tokens.css">
<link rel="stylesheet" href="ds/babystep/fonts/fonts.css">
<link rel="stylesheet" href="ds/babystep/components/bundle.css">
<script src="ds/babystep/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f8f4ee}
a{color:#9a4734;text-decoration:none}a:hover{color:#7c3b30}
a:focus-visible,button:focus-visible{outline:2px solid #c76e48;outline-offset:3px}
.sgrow{cursor:pointer;transition:background .15s ease,border-color .15s ease}.sgrow:hover{border-color:#d9a37f !important}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--color-canvas); color: var(--color-ink); font-family: var(--font-sans);">

<div aria-hidden="true" style="max-width: 1280px; margin: 0 auto; padding: 72px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px;">
<div style="aspect-ratio: 1 / 1; border-radius: 28px; overflow: hidden; background: var(--color-muted);"><img src="/_blob/b737f3d4d317b0dbc227b0267164c715" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
<div style="display: flex; flex-direction: column; gap: 16px; padding-top: 8px;">
<span style="font-family: var(--font-accent); font-weight: 700; font-size: 36px;">Muslino miegmaišis</span>
<span style="font-size: 30px; font-weight: 700;">39,99 €</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43, 36, 33, 0.38);"></div>

<div role="dialog" aria-modal="true" aria-labelledby="sg-d" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 680px; box-sizing: border-box; background: #ffffff; border: 1px solid var(--color-line); border-radius: 28px; box-shadow: 0 16px 40px rgba(43, 36, 33, 0.12); padding: 32px; display: flex; flex-direction: column; gap: 20px;">
<span style="position: absolute; top: 18px; right: 18px;"><x-import component-from-global-scope="Babystep.IconButton" label="Uždaryti" icon="{{icClose}}" on-click="{{noop}}"></x-import></span>
<div style="display: flex; flex-direction: column; gap: 8px; padding-right: 48px;">
<h2 id="sg-d" style="margin: 0; font-family: var(--font-accent); font-weight: 700; font-size: 30px; line-height: 1.15;">Kaip išsirinkti dydį</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: var(--color-ink-soft);">Rinkis pagal mažylio ūgį, ne tik amžių. Jei abejoji tarp dviejų dydžių, imk didesnį, užaugs.</p>
</div>

<div>
<div role="table" aria-label="Dydžių lentelė" style="border: 1px solid var(--color-line); border-radius: 18px; overflow: hidden; font-size: 16px; font-variant-numeric: tabular-nums;">
<div role="row" style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; background: var(--color-muted-soft); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--color-ink-muted);"><span role="columnheader" style="padding: 10px 20px;">Dydis</span><span role="columnheader" style="padding: 10px 20px;">Ūgis</span><span role="columnheader" style="padding: 10px 20px;">Svoris</span><span role="columnheader" style="padding: 10px 20px;">Ilgis</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; align-items: center; min-height: 52px; border-top: 1px solid var(--color-line); background: #ffffff;"><span role="rowheader" style="padding: 0 20px; font-weight: 700; color: var(--color-ink); white-space: nowrap;">{{r.label}}</span><span role="cell" style="padding: 0 20px; color: var(--color-ink-soft); white-space: nowrap;">{{r.height}}</span><span role="cell" style="padding: 0 20px; color: var(--color-ink-soft); white-space: nowrap;">{{r.weight}}</span><span role="cell" style="padding: 0 20px; color: var(--color-ink-soft); white-space: nowrap;">{{r.len}}</span></div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; border-top: 1px solid var(--color-line);">
<p style="margin: 0; font-size: 15px; color: var(--color-ink-soft);">Vis dar abejoji? <a href="#kontaktai" style="font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">Parašyk mums</a>, mielai padėsim.</p>
<x-import component-from-global-scope="Babystep.Button" variant="secondary" label="Uždaryti" on-click="{{noop}}"></x-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const R = window.React, B = window.Babystep || {}, I = B.Icons || {};
    const ic = (n, s) => (R && I[n]) ? R.createElement(I[n], { size: s || 16 }) : null;
    const st = this.state || {};
    const sel = st.s || 's0';
    const GUIDE = [
      { id: 's0', label: '0–6 mėn.', height: '[56–68] cm', weight: '[4–8] kg', len: '70 cm' },
      { id: 's1', label: '6–12 mėn.', height: '[68–80] cm', weight: '[8–10] kg', len: '80 cm' },
      { id: 's2', label: '12–18 mėn.', height: '[80–86] cm', weight: '[10–12] kg', len: '90 cm' },
      { id: 's3', label: '18–36 mėn.', height: '[86–98] cm', weight: '[12–15] kg', len: '100 cm' }
    ];
    return {
      n16: 16, noop: () => {}, icClose: ic('X', 18),
      rows: GUIDE.map((g) => ({ ...g, sel: g.id === sel, pressed: g.id === sel ? 'true' : 'false',
        aria: 'Pasirinkti ' + g.label + ': ūgis ' + g.height + ', svoris ' + g.weight + ', ilgis ' + g.len,
        bg: g.id === sel ? 'var(--color-tumbleweed-50)' : '#ffffff',
        bd: g.id === sel ? '1px solid var(--color-tumbleweed-300)' : '1px solid var(--color-line)',
        pick: () => this.setState({ s: g.id }) }))
    };
  }
}
</script>
</body>
</html>
