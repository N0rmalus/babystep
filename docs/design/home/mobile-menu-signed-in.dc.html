<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Babystep · mobilusis meniu (prisijungus)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/babystep/tokens.css">
<link rel="stylesheet" href="ds/babystep/fonts/fonts.css">
<link rel="stylesheet" href="ds/babystep/components/bundle.css">
<script src="ds/babystep/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f8f4ee}
a{color:#9a4734;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #c76e48;outline-offset:3px}
.mrow{color:#2b2421}.mrow:hover{color:#9a4734}
.chip{transition:border-color .2s ease,background .2s ease}.chip:hover{border-color:#d9a37f !important;background:#fbf6f1 !important}
</style>
</helmet>
<div role="dialog" aria-label="Meniu" style="width: 390px; min-height: 844px; box-sizing: border-box; background: var(--color-canvas); color: var(--color-ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
<div style="height: 56px; flex: 0 0 auto; padding: 0 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--color-line);">
<div style="display: flex;"><x-import component-from-global-scope="Babystep.IconButton" label="Uždaryti meniu" icon="{{icClose}}" on-click="{{noop}}"></x-import></div>
<a href="#" aria-label="Babystep pradžia" style="display: flex; align-items: center; gap: 6px; color: var(--color-ink);"><img src="/_blob/eba72f499df045e7ead825c1efde6e2d" alt="" style="height: 26px; width: auto; display: block;"><span style="font-family: var(--font-accent); font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">Babystep</span></a>
<div style="display: flex; justify-content: flex-end;"><x-import component-from-global-scope="Babystep.IconButton" href="#krepselis" label="Krepšelis, 2 prekės" icon="{{icCart}}" badge="{{cartCount}}"></x-import></div>
</div>
<nav aria-label="Meniu" style="padding: 8px 20px 32px; display: flex; flex-direction: column;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="padding: 10px 0 8px;">
<a href="#kategorija" class="mrow" style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-weight: 600; font-size: 20px;"><span>{{g.name}}</span><span style="color: var(--color-ink-muted); display: flex;"><x-import component-from-global-scope="Babystep.Icons.ChevronRight" size="{{n18}}"></x-import></span></a>
<sc-if value="{{g.hasSubs}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px;">
<sc-for list="{{g.subs}}" as="s" hint-placeholder-count="3">
<a href="#subkategorija" class="chip" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--color-tumbleweed-200); background: #ffffff; color: var(--color-ink-soft); font-size: 14px;">{{s}}</a>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<a href="#akcijos" style="display: flex; align-items: center; justify-content: space-between; height: 56px; margin-top: 4px; color: var(--color-sale-strong); font-weight: 600; font-size: 20px;"><span>Akcijos</span><x-import component-from-global-scope="Babystep.Badge" color="sale" label="Iki −20 %"></x-import></a>
<div style="height: 1px; background: var(--color-line); margin: 12px 0;"></div>
<a href="#norai" class="mrow" style="display: flex; align-items: center; justify-content: space-between; height: 52px; font-weight: 600; font-size: 20px;"><span>Norai</span><span style="color: var(--color-ink-muted); display: flex;"><x-import component-from-global-scope="Babystep.Icons.Heart" size="{{n18}}"></x-import></span></a>
<a href="#profilis" class="mrow" style="display: flex; align-items: center; justify-content: space-between; height: 52px; font-weight: 600; font-size: 20px;"><span>Profilis</span><span style="color: var(--color-ink-muted); display: flex;"><x-import component-from-global-scope="Babystep.Icons.ChevronRight" size="{{n18}}"></x-import></span></a>
<div style="height: 1px; background: var(--color-line); margin: 12px 0 16px;"></div>
<div style="display: flex; gap: 10px;">
<x-import component-from-global-scope="Babystep.IconButton" href="#instagram" label="Instagram" icon="{{icInsta}}"></x-import>
<x-import component-from-global-scope="Babystep.IconButton" href="#facebook" label="Facebook" icon="{{icFb}}"></x-import>
</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = window.React, I = (window.Babystep || {}).Icons || {};
    const ic = (n, s) => (R && I[n]) ? R.createElement(I[n], { size: s || 18 }) : null;
    return {
      n18: 18, noop: () => {}, icClose: ic('X'), icCart: ic('ShoppingCart'), icInsta: ic('Instagram', 16), icFb: ic('Facebook', 16),
      cartCount: R ? R.createElement('span', { className: 'bg-ink flex size-5 items-center justify-center rounded-full text-xs font-semibold text-white tabular-nums' }, '2') : null,
      groups: [
        { name: 'Miegui', hasSubs: true, subs: ['Pledai', 'Lizdeliai', 'Apsaugėlės'] },
        { name: 'Priežiūrai', hasSubs: true, subs: ['Rankšluostukai', 'Merliukai', 'Žinduko laikikliai', 'Pončai'] },
        { name: 'Aksesuarai', hasSubs: true, subs: ['Tapukai / kojinytės'] },
        { name: 'Žaislai', hasSubs: false, subs: [] },
        { name: 'Dovanų rinkiniai', hasSubs: false, subs: [] }
      ]
    };
  }
}
</script>
</body>
</html>
